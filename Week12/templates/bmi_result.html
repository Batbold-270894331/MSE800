<!DOCTYPE html>
<html>
    <head>
        <title>BMI Result</title>

        <style>
            body{
                font-family: Arial;
                text-align:center;
                margin-top:50px;
            }

            .badge{
                display:inline-block;
                padding:10px 20px;
                color:white;
                font-weight:bold;
                border-radius:20px;
                margin:15px;
            }

            .underweight{
                background-color:#3498db;
            }

            .normal{
                background-color:#2ecc71;
            }

            .overweight{
                background-color:#f39c12;
            }

            .obese{
                background-color:#e74c3c;
            }

            button{
                padding:10px 20px;
            }

        </style>

    </head>
    <body>

        <h1>BMI Result</h1>

        <h2>Your BMI: {{ bmi }}</h2>

        {% if category == "Underweight" %}
            <div class="badge underweight">{{ category }}</div>

        {% elif category == "Normal weight" %}
            <div class="badge normal">{{ category }}</div>

        {% elif category == "Overweight" %}
            <div class="badge overweight">{{ category }}</div>

        {% else %}
            <div class="badge obese">{{ category }}</div>

        {% endif %}

        <br><br>

        <form action="/" method="GET">
            <button type="submit">Try Again</button>
        </form>

    </body>
</html>
