<!DOCTYPE html>
<html>
    <head>
        <title>BMI Calculator</title>
        <style>
            body{
                font-family: Arial;
                text-align: center;
                margin-top: 50px;
            }

            .form-group {
                margin: 15px 0;
            }

            .form-group label {
                display: inline-block;
                width: 100px;
                text-align: right;
                margin-right: 10px;
            }

            .form-group input {
                width: 180px;
                padding: 5px;
            }

            button{
                padding: 10px 20px;
            }
        </style>
    </head>
    <body>
        <h1>BMI Calculator</h1>
        <form action="/calculate" method="POST">
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number"
                    name="weight"
                    min="1"
                    max="200"
                    step="0.1"
                    placeholder="e.g. 70.5"
                    required>
            </div>

            <div class="form-group">
                <label for="height">Height (m):</label>
                <input type="number"
                    name="height"
                    min="0.5"
                    max="2.5"
                    step="0.01"
                    placeholder="e.g. 1.75"
                    required>
            </div>

            <br><br>
            <button type="submit">Calculate BMI</button>
        </form>
    </body>
</html>
